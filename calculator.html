<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
   <center> <h1>Calculator</h1>
    <div class="device">
    <div class="output">
    <div class="previous-disp">1</div>
    <div class="current-disp">2</div>
    </div>
    <button class="clear" id="ac">AC</button>
    <button class="delete" id="del">DEL</button>
    <button class="operation" id="dv">/</button><br>
    <button class="number">1</button>
    <button class="number">2</button>
    <button class="number">3</button>
    <button class="operation">+</button><br>
    <button class="number">4</button>
    <button class="number">5</button>
    <button class="number">6</button>
    <button class="operation">-</button><br>
    <button class="number">7</button>
    <button class="number">8</button>
    <button class="number">9</button>
    <button class="operation">*</button><br>
    <button class="number" id="dot">.</button>
    <button class="number">0</button>
    <button class="equal" id="eq">=</button>
    </div>
    </center>
    <script src="cl.js"></script>
    
</body>
</html>
